<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1E3A8A">
    <title>Explorar conteúdos | DevAcademy</title>

    <link rel="stylesheet" href="../../../styles/tokens.css">
    <link rel="stylesheet" href="../../../styles/global.css">
    <link rel="stylesheet" href="../../../styles/components.css">
    <link rel="stylesheet" href="../../../styles/contents.css">

    <script type="module" src="../../../scripts/modules/contents/explore.js"></script>
</head>
<body>
    <main class="contents-page">
        <div class="contents-container">

            <header class="contents-header">
                <div class="contents-header__text">
                    <h1 class="contents-title" id="explore-title">Explorar conteúdos</h1>
                    <p class="contents-subtitle">
                        Descubra o que a comunidade está publicando sobre programação e tecnologia.
                    </p>
                </div>
            </header>

            <form
                class="contents-search"
                id="explore-search-form"
                role="search"
                action="../search/index.html"
                method="get"
            >
                <div class="contents-search__field">
                    <label class="contents-sr-only" for="explore-keyword">Buscar conteúdos</label>
                    <input
                        class="form-control"
                        id="explore-keyword"
                        name="keyword"
                        type="search"
                        placeholder="Buscar por título ou texto"
                        autocomplete="off"
                        required
                    >
                </div>

                <button class="btn btn-primary" type="submit">Buscar</button>
            </form>

            <section
                id="explore-region"
                aria-labelledby="explore-title"
                aria-busy="true"
            >
                <p class="contents-summary" id="explore-summary" role="status" hidden></p>

                <!-- Carregamento -->
                <div id="explore-loading">
                    <p class="contents-sr-only" role="status">Carregando conteúdos…</p>

                    <ul class="contents-grid" aria-hidden="true">
                        <li>
                            <div class="content-card content-card--skeleton">
                                <span class="contents-skeleton contents-skeleton--title"></span>
                                <span class="contents-skeleton contents-skeleton--line"></span>
                                <span class="contents-skeleton contents-skeleton--line"></span>
                                <span class="contents-skeleton contents-skeleton--short"></span>
                                <span class="contents-skeleton contents-skeleton--tag"></span>
                            </div>
                        </li>
                        <li>
                            <div class="content-card content-card--skeleton">
                                <span class="contents-skeleton contents-skeleton--title"></span>
                                <span class="contents-skeleton contents-skeleton--line"></span>
                                <span class="contents-skeleton contents-skeleton--line"></span>
                                <span class="contents-skeleton contents-skeleton--short"></span>
                                <span class="contents-skeleton contents-skeleton--tag"></span>
                            </div>
                        </li>
                        <li>
                            <div class="content-card content-card--skeleton">
                                <span class="contents-skeleton contents-skeleton--title"></span>
                                <span class="contents-skeleton contents-skeleton--line"></span>
                                <span class="contents-skeleton contents-skeleton--line"></span>
                                <span class="contents-skeleton contents-skeleton--short"></span>
                                <span class="contents-skeleton contents-skeleton--tag"></span>
                            </div>
                        </li>
                        <li>
                            <div class="content-card content-card--skeleton">
                                <span class="contents-skeleton contents-skeleton--title"></span>
                                <span class="contents-skeleton contents-skeleton--line"></span>
                                <span class="contents-skeleton contents-skeleton--line"></span>
                                <span class="contents-skeleton contents-skeleton--short"></span>
                                <span class="contents-skeleton contents-skeleton--tag"></span>
                            </div>
                        </li>
                        <li>
                            <div class="content-card content-card--skeleton">
                                <span class="contents-skeleton contents-skeleton--title"></span>
                                <span class="contents-skeleton contents-skeleton--line"></span>
                                <span class="contents-skeleton contents-skeleton--line"></span>
                                <span class="contents-skeleton contents-skeleton--short"></span>
                                <span class="contents-skeleton contents-skeleton--tag"></span>
                            </div>
                        </li>
                        <li>
                            <div class="content-card content-card--skeleton">
                                <span class="contents-skeleton contents-skeleton--title"></span>
                                <span class="contents-skeleton contents-skeleton--line"></span>
                                <span class="contents-skeleton contents-skeleton--line"></span>
                                <span class="contents-skeleton contents-skeleton--short"></span>
                                <span class="contents-skeleton contents-skeleton--tag"></span>
                            </div>
                        </li>
                    </ul>
                </div>

                <!-- Erro -->
                <div class="contents-state contents-state--error" id="explore-error" role="alert" hidden>
                    <h2 class="contents-state__title">Não foi possível carregar os conteúdos</h2>
                    <p class="contents-state__text" id="explore-error-text">
                        Verifique sua conexão e tente novamente.
                    </p>
                    <button class="btn btn-primary" id="explore-retry" type="button">
                        Tentar novamente
                    </button>
                </div>

                <!-- Lista vazia -->
                <div class="contents-state contents-state--empty" id="explore-empty" hidden>
                    <h2 class="contents-state__title">Ainda não há conteúdos publicados</h2>
                    <p class="contents-state__text">
                        Quando alguém publicar, o conteúdo aparecerá aqui.
                    </p>
                </div>

                <!-- Lista de conteúdos (preenchida pelo JavaScript) -->
                <ul class="contents-grid" id="explore-list" hidden></ul>

                <!-- Paginação (exibida só quando totalPages > 1) -->
                <nav
                    class="contents-pagination"
                    id="explore-pagination"
                    aria-label="Paginação de conteúdos"
                    hidden
                >
                    <p class="contents-pagination__info" id="explore-pagination-info"></p>
                    <ul class="contents-pagination__list" id="explore-pagination-list"></ul>
                </nav>
            </section>
        </div>
    </main>

    <!-- Modelo do cartão: o JavaScript clona este bloco para cada conteúdo -->
    <template id="explore-card-template">
        <li>
            <article class="content-card">
                <h2 class="content-card__title">
                    <a class="content-card__link" data-field="link" href="#"></a>
                </h2>

                <p class="content-card__summary" data-field="summary"></p>

                <ul class="hashtag-list content-card__tags" data-field="tags"></ul>

                <footer class="content-card__footer">
                    <p class="content-author">
                        Por <span class="content-author__name" data-field="author"></span>
                    </p>
                    <ul class="content-meta">
                        <li class="content-meta__item">
                            <time data-field="date" datetime=""></time>
                        </li>
                    </ul>
                </footer>
            </article>
        </li>
    </template>

    <!-- Modelo de cada hashtag do cartão -->
    <template id="explore-tag-template">
        <li><span class="hashtag" data-field="tag"></span></li>
    </template>

    <!-- Modelo dos itens da paginação -->
    <template id="explore-page-item-template">
        <li class="contents-pagination__item">
            <button class="contents-pagination__link" data-field="page" type="button"></button>
        </li>
    </template>
</body>
</html>
