<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meu Perfil</title>
    <link rel="stylesheet" href="../../../styles/tokens.css" />
    <link rel="stylesheet" href="../../../styles/global.css" />
    <link rel="stylesheet" href="../../../styles/components.css" />
    <link rel="stylesheet" href="../../../styles/users.css" />
</head>
<body class="user-page">
    <main class="user-container">
        <nav class="user-nav" aria-label="Navegação da área do usuário">
            <a class="user-nav-link is-active" href="./index.html" aria-current="page">
                Perfil
            </a>
            <a class="user-nav-link" href="../edit/index.html">
                Editar perfil
            </a>
            <a class="user-nav-link" href="../activities/index.html">
                Atividades
            </a>
            <a class="user-nav-link" href="../settings/index.html">
                Configurações
            </a>
        </nav>

        <div
            id="profile-error"
            class="user-message alert-error"
            role="alert"
            aria-live="assertive"
            hidden
        >
            <span id="profile-error-message">
                Não foi possível carregar os dados do perfil.
            </span>
        </div>

        <section
            id="profile-loading"
            class="user-card user-state-box"
            role="status"
            aria-live="polite"
        >
            <span class="user-loading-spinner" aria-hidden="true"></span>
            <h1 class="user-state-title">Carregando perfil...</h1>
            <p class="user-state-text">
                Buscando as informações da sua conta.
            </p>
        </section>

        <section id="profile-content" class="user-card" aria-labelledby="user-name" hidden>
            <header class="user-profile-header">
                <div class="user-profile-identity">
                    <div class="user-avatar user-avatar--lg">
                        <img
                            id="user-avatar-img"
                            class="user-avatar-img"
                            src=""
                            alt="Foto de perfil do usuário"
                            hidden
                        />
                        <span
                            id="user-avatar-placeholder"
                            class="user-avatar-placeholder"
                            aria-hidden="true"
                        >
                            U
                        </span>
                    </div>

                    <div class="user-identity-text">
                        <div class="user-name-row">
                            <h1 id="user-name" class="user-name"></h1>
                            <span id="user-status-badge" class="user-status-badge" hidden></span>
                        </div>
                        <p id="user-email" class="user-email"></p>
                    </div>
                </div>

                <div class="user-profile-actions">
                    <a class="user-btn user-btn--primary" href="../edit/index.html">
                        Editar perfil
                    </a>
                    <a class="user-btn user-btn--secondary" href="../activities/index.html">
                        Atividades
                    </a>
                    <a class="user-btn user-btn--secondary" href="../settings/index.html">
                        Configurações
                    </a>
                </div>
            </header>

            <div class="user-bio-block">
                <h2 class="user-block-label">Biografia</h2>
                <p id="user-biography" class="user-bio-text"></p>
            </div>

            <dl class="user-meta-grid">
                <div class="user-meta-item">
                    <dt class="user-meta-label">Conta criada em</dt>
                    <dd id="user-created-at" class="user-meta-value"></dd>
                </div>

                <div class="user-meta-item">
                    <dt class="user-meta-label">Última atualização</dt>
                    <dd id="user-updated-at" class="user-meta-value"></dd>
                </div>
            </dl>
        </section>
    </main>

    <script type="module" src="../../../scripts/modules/users/profile.js"></script>
</body>
</html>
