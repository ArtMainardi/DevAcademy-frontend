<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Atividades do Usuário</title>
    <link rel="stylesheet" href="../../../styles/tokens.css" />
    <link rel="stylesheet" href="../../../styles/global.css" />
    <link rel="stylesheet" href="../../../styles/components.css" />
    <link rel="stylesheet" href="../../../styles/users.css" />
</head>
<body class="user-page">
    <main class="user-container">
        <nav class="user-nav" aria-label="Navegação da área do usuário">
            <a class="user-nav-link" href="../profile/index.html">
                Perfil
            </a>
            <a class="user-nav-link" href="../edit-profile/index.html">
                Editar perfil
            </a>
            <a class="user-nav-link is-active" href="./index.html" aria-current="page">
                Atividades
            </a>
        </nav>

        <header class="user-section-header">
            <div>
                <h1 id="activities-title" class="user-section-title">
                    Atividades recentes
                </h1>
                <p class="user-section-subtitle">
                    Histórico cronológico das suas ações na plataforma.
                </p>
            </div>
            <a class="user-btn user-btn--secondary" href="../profile/index.html">
                Voltar ao perfil
            </a>
        </header>

        <div
            id="activities-message"
            class="user-message"
            role="alert"
            aria-live="assertive"
            hidden
        >
            <span id="activities-message-text"></span>
        </div>

        <section
            id="activities-loading"
            class="user-card user-state-box"
            role="status"
            aria-live="polite"
        >
            <span class="user-loading-spinner" aria-hidden="true"></span>
            <h2 class="user-state-title">Carregando atividades...</h2>
            <p class="user-state-text">
                Aguarde enquanto buscamos seu histórico de atividades.
            </p>
        </section>

        <section
            id="activities-empty"
            class="user-card user-state-box"
            aria-live="polite"
            hidden
        >
            <h2 class="user-state-title">Nenhuma atividade registrada</h2>
            <p class="user-state-text">
                Você ainda não possui atividades no seu histórico.
            </p>
        </section>

        <section
            id="activities-content"
            class="user-card"
            aria-labelledby="activities-title"
            hidden
        >
            <ol id="activities-list" class="user-activities-list"></ol>
        </section>
    </main>

    <script type="module" src="../../../scripts/modules/users/activities.js"></script>
</body>
</html>
